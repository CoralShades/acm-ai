    "NO": "No"
  Asbestos_Register_Available__c:
    "YES": "Yes"
    "NO": "No"
  Audit_Report_Available__c:
    "YES": "Yes"
    "NO": "No"
  Within_Your_Portfolio__c:
    "YES": "Yes"
    "NO": "No"

