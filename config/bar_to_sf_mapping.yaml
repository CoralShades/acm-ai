  # based on Clutch_Broadmeadows.csv inspection 2026-04-11.
  # - Building_Type__c, Building_Category__c: 137/13 values, too many to anticipate
  #   without case studies; extractor falls through to nearest-match or flag-for-review.
  # - Owned_or_Leased__c: identity (Owned/Leased match SF exactly).
  # - Public_Access__c, Asbestos_Register_Available__c, Audit_Report_Available__c:
  #   all `Yes/No` in SF. CSV uses `YES/NO` (caps) — case normalization applied below.
  Public_Access__c:
