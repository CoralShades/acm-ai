# KEY CHANGES (2026-03-11 - Docling export_to_dict Fix — Per-Row Extraction Unblocked):
# ====================================================================================
# ROOT CAUSE FOUND: DoclingAdapter.export_to_dict() was never a valid method on TableItem.
# TableItem is a Pydantic model — correct method is table.data.model_dump(mode="python").
# This caused docling_document_json to be NULL for ALL tables since the feature was added,
# making per-row extraction impossible (always fell back to bulk).
# Fix: docling_adapter.py:151 — table.export_to_dict() → table.data.model_dump(mode="python")
# Also fixed: acm.py:2350 — field_schema query now targets field_schema:default directly
#   (was SELECT * FROM field_schema which hit sf_v1 record lacking config_json field)
# Test suite: 2123 passed. Lint clean.
#
