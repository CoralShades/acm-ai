  #   - _run_in_thread() helper removed
  #   - contextvars now propagate correctly through async call chain
  # Phase 1 (foundation):
  #   - MemorySaver replaced with AsyncSqliteSaver (data/chat_checkpoints.db)
  #   - Durable persistence across server restarts
  #   - Graph compilation deferred to get_unified_graph() lazy accessor
  #   - graph initialized in FastAPI lifespan after checkpointer ready
  #   - thread_id added to ChatSession domain model + API responses
  #   - UUID thread_id generated on session create, maps to LangGraph checkpointer
  #   - Migration 56: thread_id field + unique index on chat_session table
  #   - Legacy HITL nodes removed (route_entry, legacy_execute_write_node); interrupt-only HITL
