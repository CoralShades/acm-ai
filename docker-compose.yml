services:
  # SurrealDB Database
  # Used for hybrid development: DB in Docker, code runs locally
  #
  # IMAGE VERSION PINNED — DO NOT CHANGE WITHOUT TESTING
  # Pinned to v2.2.1 because surrealdb/surrealdb:v2 is a rolling tag that
  # advanced to v2.6.3, which uses CBOR serialization revision 157.
  # The Python SDK (surrealdb==1.0.8, latest) cannot deserialize revision 157,
  # causing "Versioned error: A deserialization error occured: Invalid revision 157"
  # on SELECT queries. v2.2.1 is the last known version compatible with SDK 1.0.8.
  #
  # pull_policy is set to "missing" to prevent accidental upgrades when the
  # rolling v2 tag moves forward.
  surrealdb:
    image: surrealdb/surrealdb:v2.2.1
    container_name: acm-ai-db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    command: start --log info --user root --pass root surrealkv://mydata/open_notebook.db
    pull_policy: missing
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # OLLAMA - Local AI Models (OPTIONAL)
  # =============================================================================
  # Use profiles to enable Ollama based on your hardware:
  #
  #   Office laptop (no GPU):     docker compose --profile ollama-cpu up -d
  #   Developer machine (GPU):    docker compose --profile ollama-gpu up -d
  #   No local AI needed:         docker compose up -d  (skips Ollama entirely)
  #
  # After starting, pull models:
  #   docker exec acm-ai-ollama ollama pull qwen3
  #   docker exec acm-ai-ollama ollama pull mxbai-embed-large
  #
  # Then set in .env: OLLAMA_API_BASE=http://ollama:11434
  # =============================================================================

  # Ollama CPU-only (for office laptops, VMs, or machines without NVIDIA GPU)
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: acm-ai-ollama
    profiles:
      - ollama-cpu
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama with NVIDIA GPU acceleration (for developer machines with GPU)
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: acm-ai-ollama
    profiles:
      - ollama-gpu
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  surreal_data:
    name: acm-ai-surreal-data
  ollama_data:
    name: acm-ai-ollama-data
