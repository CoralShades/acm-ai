[project]
name = "open-notebook"
version = "1.2.3"
description = "An open source implementation of a research assistant, inspired by Google Notebook LM"
authors = [
    {name = "Luis Novo", email = "lfnovo@gmail.com"}
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "langchain>=0.3.3",
    "langgraph>=0.2.38",
    "tiktoken>=0.8.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-community>=0.3.3",
    "langchain-openai>=0.2.3",
    "langchain-anthropic>=0.2.3",
    "langchain-ollama>=0.2.0",
    "langchain-google-genai>=2.1.10",
    "langchain-groq>=0.2.1",
    "langchain_mistralai>=0.2.1",
    "langchain_deepseek>=0.1.3",
    "tomli>=2.0.2",
    "groq>=1.1.2",
    "python-dotenv>=1.0.1",
    "httpx[socks]>=0.27.0",
    "content-core>=1.0.2",
    "ai-prompter>=0.3",
    "esperanto>=2.8.3",
    "langchain-google-vertexai>=2.0.28",
    "surrealdb>=1.0.8",
    "podcast-creator>=0.7.0",
    "surreal-commands>=1.2.0",
    "openpyxl>=3.1.5",
    "ag-ui-protocol>=0.1.11",
    "ag-ui-langgraph>=0.0.25",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "docling>=2.75.0",
    "textual>=1.0.0",
    "typer>=0.20.0",
    "langfuse>=3.14.5",
    "mineru>=2.7.0",
    "runpod>=1.8.1",
    "runpod-flash>=1.9.1",
    "copilotkit>=0.1.78",
]

[tool.setuptools]
package-dir = {"open_notebook" = "open_notebook"}


[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.5.5",
    "mypy>=1.11.1",
    "types-requests>=2.32.0.20241016",
    "ipywidgets>=8.1.5",
    "pre-commit>=4.0.1",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.1.0",
    "langgraph-api>=0.7.0",
    "logfire>=3.0.0",
    "pre-commit>=4.1.0",
    "pytest-asyncio>=1.2.0",
    "rich>=13.0.0",
    "ruff>=0.14.7",
    "types-requests>=2.32.4.20250913",
    # erdantic>=1.2.0 — install manually: needs pygraphviz + Graphviz C headers
    # pip install erdantic  (after: winget install graphviz / brew install graphviz)
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
exclude = [".agents", ".claude", ".codex", ".opencode", "tui"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file (Streamlit requires this pattern)
    "E722",  # do not use bare except (legacy code pattern)
    "F401",  # imported but unused (may be used in type hints or re-exports)
    "F541",  # f-string without placeholders
    "F841",  # local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
# Streamlit files need nest_asyncio.apply() before imports
"app_home.py" = ["E402"]
"pages/**/*.py" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring external services (ANTHROPIC_API_KEY, DB, etc.)",
    "v3_benchmark: marks tests as V3 dual-provider benchmark quality gates (require benchmark fixtures)",
    "v3_e2e: V3 end-to-end accuracy tests (require RUN_E2E_LLM=true)",
]

[tool.mypy]
# Exclude Streamlit UI pages from type checking
[[tool.mypy.overrides]]
module = "pages.*"
ignore_errors = true
