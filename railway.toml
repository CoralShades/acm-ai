[build]
dockerfilePath = "Dockerfile.api"
# Only rebuild when backend-relevant files change (not docs, frontend, marketing-site)
watchPatterns = [
    "api/**",
    "commands/**",
    "migrations/**",
    "open_notebook/**",
    "prompts/**",
    "scripts/**",
    "pyproject.toml",
    "uv.lock",
    "Dockerfile.api",
    "supervisord.api.conf",
    "run_api.py",
    "run_worker.py",
    "railway.toml"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
