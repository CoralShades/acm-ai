        - tests/test_validator.py
      acceptance_criteria:
        - "Regex-first classifier resolves majority of product types"
        - "LLM enrichment and correction are batched and targeted"
        - "Validation retries capped and deterministic"
        - "Benchmark deltas meet or exceed baseline gate thresholds"

    e29-s7:
      title: "Dual-Benchmark Validation Gate + Legacy Dead-Code Cleanup"
      status: planned
      points: 2
      phase: 4
      depends_on: [e29-s6]
      gaps: [GAP-1-dual-path, GAP-6-dead-code]
      files:
