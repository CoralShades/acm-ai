      acceptance_criteria:
        - "Broadmeadows remains 31/31 after decomposition"
        - "Alexander reaches >=40/43 or documented approved threshold"
        - "prepare_context/extract_records legacy path removed"
        - "Legacy feature flags and dead branches removed"
