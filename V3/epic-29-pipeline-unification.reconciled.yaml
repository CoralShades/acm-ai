        - open_notebook/extractors/strategy_registry.py
        - open_notebook/extractors/acm_schemas.py
        - tests/test_strategy_registry.py
      acceptance_criteria:
        - "Strategy selection rules are centralized and testable"
        - "Fallback behavior is explicit for no-inventory/no-table/llm-failure cases"
        - "Validation and correction retry contract is codified"
        - "Parity gate confirms Broadmeadows 31/31 and Alexander >=36/43"

    e29-s5:
      title: "Agent Decomposition I - Table Parser + BAR Mapper"
      status: planned
      points: 3
      phase: 3
      depends_on: [e29-s4]
      gaps: [GAP-2-table-priority, GAP-3-monolithic-logic]
