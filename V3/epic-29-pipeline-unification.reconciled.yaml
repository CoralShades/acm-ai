epic_29_pipeline_unification:
  title: "Pipeline Unification - Unified Agent Pipeline"
  status: planned
  total_stories: 8
  total_points: 19
  strategy: "Measure first, then unify, then decompose, then clean up"

  source_of_truth:
    - "SCP-20260301-unified-pipeline (sequencing and blocker detail)"
    - "BMAD audit (benchmark rigor and decomposition guidance)"
    - "Original Epic 29 YAML (implementation coverage)"

  goals:
    - "Single extraction path for all documents through orchestrator"
    - "Deterministic fallback and validation contract"
    - "Benchmark harness with reproducible quality/cost/performance gates"
    - "Incremental agent decomposition without Broadmeadows regression"
    - "Legacy-path removal only after parity gate is passed"

  non_goals:
    - "No embeddings/copilot/knowledge-graph feature expansion"
    - "No provider migration outside existing routing strategy"
    - "No broad UI redesign beyond extraction/export surfaces"

  decision_gates:
    gate_1_baseline_harness:
      after: e29-s2
      criteria:
        - "Automated benchmark harness runs at least 3 benchmark documents"
        - "Ground truth exists for Broadmeadows, Alexander, and one additional format"
        - "Baseline metrics captured: recall, precision, field accuracy, latency, token usage"
      blocking: [e29-s3, e29-s4, e29-s5, e29-s6, e29-s7, e29-s8]

    gate_2_unified_path_parity:
      after: e29-s4
      criteria:
        - "Broadmeadows remains 31/31 on unified orchestrator path"
        - "Alexander baseline is >=36/43 with all buildings producing records"
        - "Docling table injection confirmed for single-building and multi-building scenarios"
      blocking: [e29-s5, e29-s6, e29-s7, e29-s8]

    gate_3_cleanup_permission:
      after: e29-s6
      criteria:
        - "No benchmark regression beyond agreed thresholds"
        - "Latency/token usage are <= baseline or explicitly approved tradeoff"
        - "Fallback and correction behavior is deterministic under test"
      blocking: [e29-s7, e29-s8]

    gate_4_release_readiness:
      after: e29-s8
      criteria:
        - "E2E extraction tests pass"
        - "Benchmark suite passes in CI"
        - "PRD/architecture/epics/sprint-status docs are updated and aligned"
      blocking: []

  stories:
    e29-s1:
      title: "JSON Parser Resilience - Fence/Preamble/Truncation Handling"
      status: planned
      points: 1
      phase: 1
      depends_on: []
      gaps: [GAP-0-parser-blocker]
      files:
        - open_notebook/graphs/utils.py
        - tests/test_json_parser.py
      acceptance_criteria:
        - "parse_json_response strips markdown fences before brace-depth scan"
        - "Conversational preamble does not affect JSON extraction"
        - "Multiple JSON blocks select largest valid complete object"
        - "Truncated JSON raises explicit truncation error"
        - "Existing unfenced behavior remains backward compatible"

    e29-s2:
      title: "Benchmark Harness + Baseline Capture (Measure-First Gate)"
      status: planned
      points: 3
      phase: 1
      depends_on: [e29-s1]
      gaps: [GAP-accuracy-measurement]
      files:
        - benchmarks/
        - scripts/research/e29_benchmark_harness.py
        - tests/integration/test_benchmark_harness.py
        - docs/reviews/e29-baseline-benchmark-report.md
      acceptance_criteria:
        - "Harness executes at least 3 benchmark documents end-to-end"
        - "Ground-truth comparison calculates recall/precision/field-accuracy"
        - "Latency and token/cost metrics recorded per benchmark"
        - "Baseline report published and versioned"
        - "CI entrypoint exists for benchmark execution"

    e29-s3:
      title: "Unified Orchestrator Path - Remove Runtime Forking"
      status: planned
      points: 3
      phase: 2
      depends_on: [e29-s1, e29-s2]
      gaps: [GAP-1-dual-path]
      files:
        - open_notebook/graphs/acm_extraction.py
        - open_notebook/extractors/orchestrator.py
        - open_notebook/extractors/acm_schemas.py
        - tests/test_orchestrator.py
        - tests/test_acm_ai_extraction.py
      acceptance_criteria:
        - "tag_pages always routes to orchestrate_extraction"
        - "should_use_orchestrator conditional routing is removed"
        - "No-inventory documents create synthetic whole-document extraction plan"
        - "Docling table injection can execute on single-building documents"
        - "Legacy path remains present but unreachable until cleanup story"

    e29-s4:
      title: "Capability Registry + Fallback Contract"
      status: planned
      points: 2
      phase: 2
      depends_on: [e29-s3]
      gaps: [GAP-3-monolithic-logic, GAP-5-routing-ambiguity]
      files:
