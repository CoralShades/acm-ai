name: Deploy Main to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        working-directory: ./frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        working-directory: ./frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  verify:
    name: Verify Vercel Deployment
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    steps:
      - name: Wait for deployment to propagate
        run: sleep 15

      - name: Check Vercel frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://demo.vaea.coralshades.ai/)
          echo "Vercel frontend: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Check API through Vercel proxy
        run: |
          RESPONSE=$(curl -sf https://demo.vaea.coralshades.ai/api/health || echo '{"status":"error"}')
          echo "API via Vercel: $RESPONSE"
          echo "$RESPONSE" | grep -q '"healthy"' || exit 1

      - name: Check runtime config
        run: |
          RESPONSE=$(curl -sf https://demo.vaea.coralshades.ai/config || echo '{}')
          echo "Runtime config: $RESPONSE"
          echo "$RESPONSE" | grep -q 'demo.vaea.coralshades.ai' || exit 1
