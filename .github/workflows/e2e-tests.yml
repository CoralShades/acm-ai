name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Nightly at 6am UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # SurrealDB Setup
      # ============================================
      - name: Start SurrealDB
        run: |
          docker run -d \
            --name surrealdb \
            -p 8000:8000 \
            -e SURREAL_EXPERIMENTAL_GRAPHQL=true \
            surrealdb/surrealdb:v2 \
            start --log info --user root --pass root memory
          timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done'

      # ============================================
      # Python Backend Setup
      # ============================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Python dependencies
        run: uv sync

      # ============================================
      # Node.js Frontend Setup
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ============================================
      # Service Startup
      # ============================================
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          API_URL=http://localhost:5055
          SURREAL_URL=ws://localhost:8000/rpc
          SURREAL_USER=root
          SURREAL_PASSWORD=root
          SURREAL_NAMESPACE=open_notebook
          SURREAL_DATABASE=development
          SURREAL_COMMANDS_RETRY_ENABLED=true
          SURREAL_COMMANDS_RETRY_MAX_ATTEMPTS=3
          SURREAL_COMMANDS_MAX_TASKS=5
          EOF

      - name: Start Backend API
        run: |
          uv run run_api.py &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          timeout 60 bash -c 'until curl -f http://localhost:5055/health 2>/dev/null; do sleep 2; done'

      - name: Start Frontend
        run: |
          cd frontend && npm run dev &
          FRONTEND_PID=$!
          echo "FRONTEND_PID=$FRONTEND_PID" >> $GITHUB_ENV
          timeout 120 bash -c 'until curl -f http://localhost:8503 2>/dev/null; do sleep 2; done'

      # ============================================
      # Tier 1: Smoke Tests (every PR)
      # ============================================
      - name: 'Tier 1: Smoke Tests'
        run: npx playwright test --project=smoke
        env:
          CI: true
          BASE_URL: http://localhost:8503

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/
          retention-days: 7

      # ============================================
      # Tier 2: Critical Tests (merges to main)
      # ============================================
      - name: 'Tier 2: Critical Tests'
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npx playwright test --project=critical
        env:
          CI: true
          BASE_URL: http://localhost:8503

      - name: Upload critical results
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: critical-results
          path: test-results/
          retention-days: 7

      # ============================================
      # Tier 3: Full Suite (nightly + manual)
      # ============================================
      - name: 'Tier 3: Feature & Accessibility Tests'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx playwright test --project=feature --project=accessibility
        env:
          CI: true
          BASE_URL: http://localhost:8503

      - name: Upload full results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: full-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Upload healing report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: healing-report
          path: test-results/healing-report.json
          retention-days: 14
          if-no-files-found: ignore

      # ============================================
      # Cleanup
      # ============================================
      - name: Stop services
        if: always()
        run: |
          [ -n "$FRONTEND_PID" ] && kill $FRONTEND_PID || true
          [ -n "$API_PID" ] && kill $API_PID || true
