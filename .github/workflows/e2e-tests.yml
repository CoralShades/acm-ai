name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # SurrealDB Setup
      # ============================================
      - name: Start SurrealDB
        run: |
          docker run -d \
            --name surrealdb \
            -p 8000:8000 \
            -e SURREAL_EXPERIMENTAL_GRAPHQL=true \
            surrealdb/surrealdb:v2 \
            start --log info --user root --pass root memory

          # Wait for SurrealDB to be ready
          echo "Waiting for SurrealDB to start..."
          timeout 30 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done'
          echo "SurrealDB is ready!"

      # ============================================
      # Python Backend Setup
      # ============================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Python dependencies
        run: uv sync

      # ============================================
      # Node.js Frontend Setup
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ============================================
      # Service Startup
      # ============================================
      - name: Create .env file
        run: |
          cat > .env << EOF
          # API Configuration
          API_URL=http://localhost:5055

          # SurrealDB Connection
          SURREAL_URL=ws://localhost:8000/rpc
          SURREAL_USER=root
          SURREAL_PASSWORD=root
          SURREAL_NAMESPACE=open_notebook
          SURREAL_DATABASE=development

          # Required for E2E tests
          SURREAL_COMMANDS_RETRY_ENABLED=true
          SURREAL_COMMANDS_RETRY_MAX_ATTEMPTS=3
          SURREAL_COMMANDS_MAX_TASKS=5
          EOF

      - name: Start Backend API
        run: |
          uv run run_api.py &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

          # Wait for API to be ready
          echo "Waiting for API to start on port 5055..."
          timeout 60 bash -c 'until curl -f http://localhost:5055/health 2>/dev/null; do sleep 2; done'
          echo "Backend API is ready!"

      - name: Start Frontend
        run: |
          cd frontend && npm run dev &
          FRONTEND_PID=$!
          echo "FRONTEND_PID=$FRONTEND_PID" >> $GITHUB_ENV

          # Wait for frontend to be ready
          echo "Waiting for frontend to start on port 8502..."
          timeout 120 bash -c 'until curl -f http://localhost:8502 2>/dev/null; do sleep 2; done'
          echo "Frontend is ready!"

      # ============================================
      # Run E2E Tests
      # ============================================
      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:8502

      # ============================================
      # Upload Artifacts (Always run, even on failure)
      # ============================================
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      # ============================================
      # Cleanup (Optional - GitHub Actions cleans up automatically)
      # ============================================
      - name: Stop services
        if: always()
        run: |
          # Kill frontend and API processes if they're still running
          [ -n "$FRONTEND_PID" ] && kill $FRONTEND_PID || true
          [ -n "$API_PID" ] && kill $API_PID || true
